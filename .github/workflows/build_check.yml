name: ESP-IDF Build Check

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.config }} (esp32s3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: default
            sdkconfig_defaults: 'sdkconfig.defaults'
          - config: metrics
            sdkconfig_defaults: 'sdkconfig.defaults;sdkconfig.defaults.metrics'
          - config: release
            sdkconfig_defaults: 'sdkconfig.defaults;sdkconfig.defaults.release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: 'v6.1'
          target: 'esp32s3'
          path: '.'
          command: idf.py -B build -D SDKCONFIG=build/sdkconfig -D SDKCONFIG_DEFAULTS="${{ matrix.sdkconfig_defaults }}" build

      - name: Check firmware files
        run: ls -l build/esp-idf-inertial-saber.bin build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/ota_data_initial.bin build/flash_args

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32s3-${{ matrix.config }}
          path: |
            build/esp-idf-inertial-saber.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
          if-no-files-found: error

  format:
    name: clang-format check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ESP_CLANG_RELEASE: esp-21.1.3_20260408
      ESP_CLANG_ARCHIVE: clang-esp-21.1.3_20260408-x86_64-linux-gnu.tar.xz
      ESP_CLANG_SHA256: 6e62bf1973b57b5388aad281ce1463e953e70b3d8df74ef4668c70f31fbeda63

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install clang-format 21.1.3 (esp-clang of ESP-IDF v6.1)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ESP_CLANG_ARCHIVE" "https://github.com/espressif/llvm-project/releases/download/$ESP_CLANG_RELEASE/$ESP_CLANG_ARCHIVE"
          echo "$ESP_CLANG_SHA256  $RUNNER_TEMP/$ESP_CLANG_ARCHIVE" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$ESP_CLANG_ARCHIVE" -C "$RUNNER_TEMP" esp-clang/bin/clang-format
          "$RUNNER_TEMP/esp-clang/bin/clang-format" --version | grep -F 'clang-format version 21.1.3'

      - name: Check formatting
        run: git ls-files -z 'main/*.cpp' 'main/*.hpp' | xargs -0 "$RUNNER_TEMP/esp-clang/bin/clang-format" --style=file:.clang-format --dry-run --Werror
